<ion-tabs>
  <ion-router-outlet></ion-router-outlet>

  <ion-tab-bar slot="bottom" class="app-shell__tab-bar">
    @for (tab of tabs; track tab.tab) {
      <ion-tab-button [tab]="tab.tab" [href]="tab.href">
        <ion-icon [ios]="tab.icon + '-outline'" [md]="tab.icon + '-sharp'"></ion-icon>
        <ion-label>{{ tab.label }}</ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
