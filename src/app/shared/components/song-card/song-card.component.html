<a
  class="song-card block rounded-3xl border border-slate-200/70 bg-white/90 p-4 no-underline shadow-sm shadow-slate-200/60"
  [routerLink]="appRoutes.songDetail(song().id)"
  [attr.aria-label]="'Open ' + song().title + ' by ' + song().artist"
>
  <div class="flex items-start justify-between gap-4">
    <div>
      <h3 class="text-lg font-semibold text-slate-950">{{ song().title }}</h3>
      <p class="mt-1 text-sm text-slate-500">{{ song().artist }}</p>
    </div>

    <span 
      class="rounded-full bg-slate-100 px-3 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.18em] text-slate-500"
      [attr.aria-label]="'Status: ' + song().status"
    >
      {{ song().status }}
    </span>
  </div>

  @if (showUploader()) {
    <p class="mt-3 text-sm text-slate-500">Shared by {{ song().uploaderName }}</p>
  }

  <div class="mt-4 flex flex-wrap gap-2" role="list" aria-label="Available instruments">
    @for (instrument of song().instrumentsAvailable; track instrument) {
      <ion-chip color="primary" outline="true" role="listitem">
        <ion-label class="capitalize">{{ instrument }}</ion-label>
      </ion-chip>
    }
  </div>
</a>
