<app-header title="Offline Songs" subtitle="Library"></app-header>

<ion-content [fullscreen]="true">
  <div class="page-shell space-y-6 px-4 pb-24 pt-28">
    <app-offline-indicator></app-offline-indicator>

    <app-library-song-list
      eyebrow="Offline"
      title="Cached songs ready without a network"
      [songs]="songs"
      [isLoading]="isLoading"
      [errorMessage]="errorMessage"
      emptyTitle="No offline songs yet"
      emptyDescription="Save a song for offline access from its detail screen to keep arrangements available on the go."
      (retry)="reload()"
    ></app-library-song-list>
  </div>
</ion-content>
