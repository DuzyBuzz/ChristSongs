<section class="section-editor rounded-3xl border border-slate-200/70 bg-slate-50/80 p-4" [formGroup]="sectionForm()">
  <div class="grid gap-3">
    <ion-item>
      <ion-input label="Section title" labelPlacement="stacked" formControlName="title"></ion-input>
    </ion-item>

    <ion-item>
      <ion-select label="Section type" labelPlacement="stacked" formControlName="type">
        @for (sectionType of sectionTypes; track sectionType) {
          <ion-select-option [value]="sectionType">{{ sectionType }}</ion-select-option>
        }
      </ion-select>
    </ion-item>
  </div>

  <div class="mt-4 grid gap-3" formArrayName="lines">
    @for (lineControl of lines.controls; track $index) {
      <div class="rounded-2xl border border-slate-200 bg-white p-3" [formGroupName]="$index">
        <div class="grid gap-3">
          <ion-item>
            <ion-input label="Chords" labelPlacement="stacked" formControlName="chordsText"></ion-input>
          </ion-item>

          <ion-item>
            <ion-textarea
              autoGrow="true"
              label="Lyrics"
              labelPlacement="stacked"
              formControlName="lyrics"
            ></ion-textarea>
          </ion-item>
        </div>

        <div class="mt-3 flex justify-end">
          <ion-button
            fill="clear"
            color="medium"
            [disabled]="lines.length <= 1"
            (click)="lineRemoved.emit({ sectionIndex: sectionIndex(), lineIndex: $index })"
          >
            Remove line
          </ion-button>
        </div>
      </div>
    }
  </div>

  <div class="mt-4 flex flex-wrap gap-2">
    <ion-button fill="outline" size="small" (click)="lineAdded.emit(sectionIndex())">
      Add line
    </ion-button>

    @if (canRemove()) {
      <ion-button fill="clear" color="danger" size="small" (click)="sectionRemoved.emit(sectionIndex())">
        Remove section
      </ion-button>
    }
  </div>
</section>
