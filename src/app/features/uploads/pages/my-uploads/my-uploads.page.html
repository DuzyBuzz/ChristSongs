<app-header title="My Songs" subtitle="Manage"></app-header>

<ion-content [fullscreen]="true">
  <div class="page-shell space-y-6 px-4 pb-24 pt-28">
    <app-offline-indicator></app-offline-indicator>

    <section class="page-section flex items-center justify-between gap-4">
      <div>
        <span class="section-heading">Your songs</span>
        <h1 class="section-title">Manage your songs and arrangements.</h1>
      </div>

      <ion-button [routerLink]="appRoutes.createSong">Create song</ion-button>
    </section>

    @if (isLoading) {
      <app-loading-skeleton></app-loading-skeleton>
    } @else if (errorMessage) {
      <app-error-state
        title="Unable to load your uploads"
        [description]="errorMessage"
        (retry)="reload()"
      ></app-error-state>
    } @else if (songs.length === 0) {
      <app-empty-state
        eyebrow="Uploads"
        title="You have not uploaded any songs yet"
        description="Create your first public song and add the initial arrangement for your team."
        actionLabel="Create song"
        [actionHref]="appRoutes.createSong"
      ></app-empty-state>
    } @else {
      <div class="grid gap-4">
        @for (song of songs; track song.id) {
          <section class="page-section space-y-4">
            <div class="flex items-start justify-between gap-4">
              <div>
                <h2 class="text-xl font-semibold text-slate-950">{{ song.title }}</h2>
                <p class="mt-1 text-sm text-slate-500">{{ song.artist }}</p>
              </div>

              <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">
                {{ song.status }}
              </span>
            </div>

            <div class="flex flex-wrap gap-3">
              <ion-button fill="outline" size="small" [routerLink]="appRoutes.songDetail(song.id)">
                View
              </ion-button>
              <ion-button fill="outline" size="small" [routerLink]="appRoutes.editSong(song.id)">
                Edit
              </ion-button>
              <ion-button color="danger" fill="clear" size="small" (click)="deleteSong(song.id)">
                Delete
              </ion-button>
            </div>
          </section>
        }
      </div>
    }
  </div>
</ion-content>
