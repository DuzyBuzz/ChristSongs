<app-header title="Search" subtitle="Discover"></app-header>

<ion-content [fullscreen]="true">
  <div class="page-shell space-y-6 px-4 pb-24 pt-28">
    <app-offline-indicator></app-offline-indicator>

    <section class="page-section space-y-4">
      <ion-searchbar
        debounce="250"
        placeholder="Search by title, artist, or who shared it"
        [value]="searchTerm"
        (ionInput)="handleSearchInput($event)"
      ></ion-searchbar>
    </section>

    <section class="page-section space-y-4">
      <div>
        <span class="section-heading">Search Mode</span>
        <div class="mt-3 flex flex-wrap gap-2">
          @for (field of fields; track field) {
            <button
              type="button"
              class="search-filter"
              [class.search-filter--selected]="field === selectedField"
              (click)="updateField(field)"
            >
              {{ getFieldLabel(field) }}
            </button>
          }
        </div>
      </div>

      <div>
        <span class="section-heading">Instrument</span>
        <div class="mt-3 flex flex-wrap gap-2">
          <button
            type="button"
            class="search-filter"
            [class.search-filter--selected]="selectedInstrument === null"
            (click)="updateInstrument(null)"
          >
            All instruments
          </button>

          @for (instrument of instruments; track instrument) {
            <button
              type="button"
              class="search-filter"
              [class.search-filter--selected]="instrument === selectedInstrument"
              (click)="updateInstrument(instrument)"
            >
              {{ getInstrumentLabel(instrument) }}
            </button>
          }
        </div>
      </div>
    </section>

    <app-song-list-section
      eyebrow="Search Results"
      title="Songs that match your search"
      [songs]="songs"
      [isLoading]="isLoading"
      [errorMessage]="errorMessage"
      [emptyTitle]="'No songs matched this search'"
      [emptyDescription]="'Try a shorter search, another field, or a different instrument.'"
      (retry)="retry()"
    ></app-song-list-section>
  </div>
</ion-content>
